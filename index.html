<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<style>
   form{
    padding-left: 10px;
    padding-right: 10px;
    border: 2px solid red;
    width: 38%;
    height: 580px;
   }

   label{
    font-size: 26px;
    float: left;
   }

   .inp{
    float: right;
    height: 40px;
    width: 300px;
    font-size: 24px;
   }

   #submit{
    height: 40px;
    width: 120px;
    font-size: 24px;
    background-color: red;
    color: white;
    cursor: pointer;
    border: none;
    border-radius: 12px;
   }
</style>
<body>
    <center>
    <form>
        <h1 style="color: red">Registration form</h1>
        <label>First Name:</label>
        <input class="inp"type="text"required><br><br><br>
        
        <label>Last Name:</label>
        <input class="inp"type="text" required><br><br><br>

         <label>Email:</label>
         <input class="inp" type="email"required><br><br><br>

         <label>Mob:</label>
         <input class="inp" type="mob"required><br><br><br>

          <label>Password:</label>
         <input class="inp" type="password"required><br><br><br>

          <label>Confirm password:</label>
         <input class="inp" type="confirm password"required><br><br><br>

          <label>Date of Birth:</label>
         <input class="inp" type="date"required><br><br><br><br><br>
            

         <input id="submit"type="submit">

    </center>


    </form>
</body>
</html>
